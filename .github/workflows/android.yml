name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "platform-tools"

      - name: Export NDK paths
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        run: npm ci

      - name: Init Android project
        run: npm run tauri android init -- --ci

      - name: Lock portrait orientation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          match = re.search(r"<activity\s[^>]*>", text)
          if not match:
              raise SystemExit("activity tag not found")
          tag = match.group(0)
          if "android:screenOrientation=" in tag:
              updated = re.sub(
                  r'android:screenOrientation="[^"]*"',
                  'android:screenOrientation="portrait"',
                  tag,
                  count=1,
              )
          else:
              updated = tag.replace(
                  "<activity",
                  '<activity android:screenOrientation="portrait"',
                  1,
              )
          path.write_text(text[: match.start()] + updated + text[match.end() :])
          PY

      - name: Build debug APK
        run: npm run tauri android build -- --apk --debug --target aarch64 --ci

      - uses: actions/upload-artifact@v4
        with:
          name: xxl-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish raw APK
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set +e
          log=/tmp/publish.log
          : > "$log"
          run() {
            echo "+ $*" >> "$log"
            "$@" >> "$log" 2>&1
            status=$?
            echo "exit $status" >> "$log"
            return "$status"
          }
          apk_src=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)
          cp "$apk_src" /tmp/xxl-debug.apk
          git worktree prune >> "$log" 2>&1
          rm -rf /tmp/apk-pub
          if run git fetch origin apk:refs/remotes/origin/apk; then
            run git worktree add /tmp/apk-pub origin/apk
          else
            run git worktree add --detach /tmp/apk-pub
            run bash -c 'cd /tmp/apk-pub && git checkout --orphan apk && git rm -rf .'
          fi
          cp /tmp/xxl-debug.apk /tmp/apk-pub/xxl-debug.apk
          run bash -c 'cd /tmp/apk-pub && git add -f xxl-debug.apk && git commit -m "Publish debug APK" && git push origin HEAD:apk'
          status=$?
          {
            echo '```'
            tail -n 40 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 0 ]; then
            echo "https://raw.githubusercontent.com/yinhaowebdev/gamesDemo/apk/xxl-debug.apk" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
